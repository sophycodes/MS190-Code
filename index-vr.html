<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Data Echoes & Traces</title>
  <meta name="description" content="VR Cyberspace Experience">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <link rel="stylesheet" href="style-vr.css">
</head>
<body>
  <a-scene 
  background="color: #000000" 
  scene-manager="currentScene: intro"
  loading-screen="dotsColor: #00ff00; backgroundColor: #000000">

    <!-- ============================================ -->
    <!-- ASSETS -->
    <!-- ============================================ -->
    <a-assets>
      <audio id="bg-music" src="assets/audio/cyber-background.mp3" preload="auto"></audio>
      <a-asset-item id="cyber-eye" src="assets/cyber_eye.glb"></a-asset-item>

      <!-- AI Images -->
      <img id="ai-car" src="assets/imgs/AI/car-AI.jpg">
      <img id="ai-face" src="assets/imgs/AI/face-AI.png">
      <img id="ai-flowers" src="assets/imgs/AI/flowers-AI.jpg">
      <img id="ai-house" src="assets/imgs/AI/house3-AI.png">
      <img id="ai-lion" src="assets/imgs/AI/lion-AI.png">
      <img id="ai-celeb" src="assets/imgs/AI/NPCeleb-AI.jpg">
      <img id="ai-poodle" src="assets/imgs/AI/poodle-AI.jpeg">
      
      <!-- Real Images -->
      <img id="real-car" src="assets/imgs/Real/car-Real.jpg">
      <img id="real-face" src="assets/imgs/Real/face-Real.jpg">
      <img id="real-flowers" src="assets/imgs/Real/flowers-Real.png">
      <img id="real-house" src="assets/imgs/Real/house-Real.jpg">
      <img id="real-lion" src="assets/imgs/Real/lion-Real.jpeg">
      <img id="real-celeb" src="assets/imgs/Real/NPCeleb-Real.jpg">
      <img id="real-poodle" src="assets/imgs/Real/poodle-Real.png">
    </a-assets>

    <!-- Background Music -->
      <a-entity id="background-music" 
          sound="src: #bg-music; loop: true; volume: 0.3; autoplay: true"
          position="0 0 0">
      </a-entity>

    <!-- ============================================ -->
    <!-- CAMERA & PLAYER (shared across all scenes) -->
    <!-- ============================================ -->
    <a-entity id="player" position="0.0 -0.4 6.5">
      <a-camera>
        <a-cursor 
          geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.012"
          material="color: #00FFFF; shader: flat"
          scale="0.3 0.3 0.3"
          raycaster="objects: .clickable; far: 6000; direction: 0 0 -1; interval: 50"
          position="0 0 -0.1"
          fuse="false">
        </a-cursor>
      </a-camera>
      
      <a-entity 
        id="leftHand" 
        hand-controls="hand: left; handModelStyle: lowPoly; color: #00FFFF"
        position="-0.3 0 -0.5"
        ribbon-trail="color: #00ffff; maxPoints: 60; fadeTime: 2000; width: 0.04"
        ghost-silhouette="color: #00ffff; interval: 400">
      </a-entity>

      <a-entity 
        id="rightHand" 
        hand-controls="hand: right; handModelStyle: lowPoly; color: #00FFFF"
        position="0.3 0 -0.5"
        ribbon-trail="color: #ff00ff; maxPoints: 60; fadeTime: 2000; width: 0.04"
        ghost-silhouette="color: #ff00ff; interval: 400">
      </a-entity>
    </a-entity>

    <!-- ============================================ -->
    <!-- INTRO SCENE - Portal Selection -->
    <!-- ============================================ -->
    <a-entity id="intro-scene">
      
      <!-- LIGHTING -->
      <a-entity light="type: ambient; color: #222; intensity: 0.4"></a-entity>
      <a-entity light="type: point; color: #FF0000; intensity: 2; distance: 20" position="-4 2 -10"></a-entity>
      <a-entity light="type: point; color: #00FF00; intensity: 2; distance: 20" position="0 2 -10"></a-entity>
      <a-entity light="type: point; color: #0000FF; intensity: 2; distance: 20" position="4 2 -10"></a-entity>

      <!-- LEFT PATHWAY - TEXT (NEON RED) -->
      <a-entity id="pathwayText" class="pathway" position="-3.5 0 0">
        
        <a-entity id="circlesLeft" position="0 1.6 -8">
          <a-ring position="0 0 0" radius-inner="1.5" radius-outer="1.6" color="#FF0000" opacity="0.3" material="shader: flat"></a-ring>
          <a-ring position="0 0 -3" radius-inner="1.5" radius-outer="1.6" color="#FF0000" opacity="0.2" material="shader: flat"></a-ring>
          <a-ring position="0 0 -6" radius-inner="1.5" radius-outer="1.6" color="#FF0000" opacity="0.15" material="shader: flat"></a-ring>
          <a-ring position="0 0 -9" radius-inner="1.5" radius-outer="1.6" color="#FF0000" opacity="0.1" material="shader: flat"></a-ring>
        </a-entity>
        
        <a-box position="-0.6 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #880000; shader: flat"></a-box>
        <a-box position="-0.3 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #CC0000; shader: flat"></a-box>
        <a-box position="0 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #FF0000; shader: flat"></a-box>
        <a-box position="0.3 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #CC0000; shader: flat"></a-box>
        <a-box position="0.6 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #880000; shader: flat"></a-box>
        
        <a-entity id="gridMarkersR">
          <a-sphere position="0 0.05 -5" radius="0.05" color="#FF0000" opacity="0.6"></a-sphere>
          <a-sphere position="0 0.05 -10" radius="0.05" color="#FF0000" opacity="0.6"></a-sphere>
          <a-sphere position="0 0.05 -15" radius="0.05" color="#FF0000" opacity="0.6"></a-sphere>
        </a-entity>
        
        <a-text 
          value="TEXT" 
          position="0 1.5 0" 
          align="center" 
          color="#FF0000" 
          width="4" 
          shader="flat"
          animation="property: position; to: 0 1.8 0; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
        </a-text>
        
        <a-entity position="0 0.8 -0.3" portal-button="target: text">
          <a-box 
            width="2" 
            height="0.6" 
            depth="0.1" 
            class="clickable"
            material="color: #000000; opacity: 0.5; transparent: true; side: double">
          </a-box>
          <a-text 
            value="[ ENTER ]" 
            align="center" 
            position="0 0 0.06"
            color="#FF0000" 
            width="3" 
            shader="flat"
            animation="property: opacity; from: 0.5; to: 1; dir: alternate; loop: true; dur: 1000">
          </a-text>
        </a-entity>

      </a-entity>

      <!-- CENTER PATHWAY - AUDIO (NEON GREEN) -->
      <a-entity id="pathwayAudio" class="pathway" position="0 0 0">
        
        <a-entity id="circlesCenter" position="0 1.6 -8">
          <a-ring position="0 0 0" radius-inner="1.5" radius-outer="1.6" color="#00FF00" opacity="0.3" material="shader: flat"></a-ring>
          <a-ring position="0 0 -3" radius-inner="1.5" radius-outer="1.6" color="#00FF00" opacity="0.2" material="shader: flat"></a-ring>
          <a-ring position="0 0 -6" radius-inner="1.5" radius-outer="1.6" color="#00FF00" opacity="0.15" material="shader: flat"></a-ring>
          <a-ring position="0 0 -9" radius-inner="1.5" radius-outer="1.6" color="#00FF00" opacity="0.1" material="shader: flat"></a-ring>
        </a-entity>
        
        <a-box position="-0.6 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #008800; shader: flat"></a-box>
        <a-box position="-0.3 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #00CC00; shader: flat"></a-box>
        <a-box position="0 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #00FF00; shader: flat"></a-box>
        <a-box position="0.3 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #00CC00; shader: flat"></a-box>
        <a-box position="0.6 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #008800; shader: flat"></a-box>
        
        <a-entity id="gridMarkersG">
          <a-sphere position="0 0.05 -5" radius="0.05" color="#00FF00" opacity="0.6"></a-sphere>
          <a-sphere position="0 0.05 -10" radius="0.05" color="#00FF00" opacity="0.6"></a-sphere>
          <a-sphere position="0 0.05 -15" radius="0.05" color="#00FF00" opacity="0.6"></a-sphere>
        </a-entity>
        
        <a-text 
          value="AUDIO" 
          position="0 1.5 0" 
          align="center" 
          color="#00FF00" 
          width="4" 
          shader="flat"
          animation="property: position; to: 0 1.8 0; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine; delay: 500">
        </a-text>
        
        <a-entity position="0 0.8 -0.3" portal-button="target: audio">
          <a-box 
            width="2" 
            height="0.6" 
            depth="0.1" 
            class="clickable"
            material="color: #000000; opacity: 0.5; transparent: true; side: double">
          </a-box>
          <a-text 
            value="[ ENTER ]" 
            align="center" 
            position="0 0 0.06"
            color="#00FF00" 
            width="3" 
            shader="flat"
            animation="property: opacity; from: 0.5; to: 1; dir: alternate; loop: true; dur: 1000">
          </a-text>
        </a-entity>

      </a-entity>

      <!-- RIGHT PATHWAY - MOVEMENT (NEON BLUE) -->
      <a-entity id="pathwayMovement" class="pathway" position="3.5 0 0">
        
        <a-entity id="circlesRight" position="0 1.6 -8">
          <a-ring position="0 0 0" radius-inner="1.5" radius-outer="1.6" color="#0000FF" opacity="0.3" material="shader: flat"></a-ring>
          <a-ring position="0 0 -3" radius-inner="1.5" radius-outer="1.6" color="#0000FF" opacity="0.2" material="shader: flat"></a-ring>
          <a-ring position="0 0 -6" radius-inner="1.5" radius-outer="1.6" color="#0000FF" opacity="0.15" material="shader: flat"></a-ring>
          <a-ring position="0 0 -9" radius-inner="1.5" radius-outer="1.6" color="#0000FF" opacity="0.1" material="shader: flat"></a-ring>
        </a-entity>
        
        <a-box position="-0.6 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #000088; shader: flat"></a-box>
        <a-box position="-0.3 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #0000CC; shader: flat"></a-box>
        <a-box position="0 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #0000FF; shader: flat"></a-box>
        <a-box position="0.3 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #0000CC; shader: flat"></a-box>
        <a-box position="0.6 0.01 -10" width="0.03" height="0.03" depth="20" material="color: #000088; shader: flat"></a-box>
        
        <a-entity id="gridMarkersB">
          <a-sphere position="0 0.05 -5" radius="0.05" color="#0000FF" opacity="0.6"></a-sphere>
          <a-sphere position="0 0.05 -10" radius="0.05" color="#0000FF" opacity="0.6"></a-sphere>
          <a-sphere position="0 0.05 -15" radius="0.05" color="#0000FF" opacity="0.6"></a-sphere>
        </a-entity>
        
        <a-text 
          value="Image" 
          position="0 1.5 0" 
          align="center" 
          color="#0000FF" 
          width="4" 
          shader="flat"
          animation="property: position; to: 0 1.8 0; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine; delay: 1000">
        </a-text>
        
        <a-entity position="0 0.8 -0.3" portal-button="target: movement">
          <a-box 
            width="2" 
            height="0.6" 
            depth="0.1" 
            class="clickable"
            material="color: #000000; opacity: 0.5; transparent: true; side: double">
          </a-box>
          <a-text 
            value="[ ENTER ]" 
            align="center" 
            position="0 0 0.06"
            color="#0000FF" 
            width="3" 
            shader="flat"
            animation="property: opacity; from: 0.5; to: 1; dir: alternate; loop: true; dur: 1000">
          </a-text>
        </a-entity>

      </a-entity>

      <!-- ENVIRONMENT -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#000000" material="shader: flat"></a-plane>
      <a-sky color="#000000"></a-sky>
      
    </a-entity>
    <!-- END INTRO SCENE -->


    <!-- ============================================ -->
    <!-- TEXT SCENE -->
    <!-- ============================================ -->
    <a-entity id="text-scene" visible="false">
    
      <!-- Dark Sky -->
      <a-sky color="#000000"></a-sky>
      
      <!-- Red Grid Floor -->
      <a-entity 
        grid-floor="size: 100; divisions: 100; colorGrid: #ff0000; colorCenterLine: #ff3333" 
        position="0 0 0">
      </a-entity>

      <!-- Lighting -->
      <a-light type="ambient" intensity="0.3" color="#220000"></a-light>
      <a-light type="point" position="0 5 0" intensity="0.5" color="#ff0000" distance="50"></a-light>

      <!-- TEXT REALM INTRO CARD -->
      <a-entity id="text-realm-card" position="0 4 0">
        
        <!-- Background plane -->
        <a-plane 
          width="10" 
          height="6" 
          position="0 0 0"
          color="#000000"
          opacity="0.8">
        </a-plane>
        
        <!-- Red border glow -->
        <a-plane 
          width="10.2" 
          height="6.2" 
          position="0 0 -0.01"
          material="color: #ff0000; shader: flat; opacity: 0.4">
        </a-plane>
        
        <!-- Title -->
        <a-text 
          value="TEXT REALM" 
          align="center" 
          position="0 3.5 0.1" 
          color="#ff0000" 
          width="12"
          shader="flat"
          letter-spacing="5">
        </a-text>
        
        <!-- Description text -->
        <a-text 
          value="Every day, 361.6 billion emails are sent and received, over 8.5 billion\nGoogle searches are made, and 350,000 tweets are posted every minute.\nWe are drowning in text data—but how much of it is true?\n\nYour challenge: Navigate four corners of this realm. Three corners pose\nquestions that test what you believe and responses from those before you.\nOne corner is a guessing game. \nCan you tell what's real from what's fake?\n\nExplore. Question. Create."
          align="center" 
          position="0 0 0.1" 
          color="#cccccc" 
          width="9"
          line-height="50"
          wrap-count="70"
          shader="flat">
        </a-text>
        
      </a-entity>
      
      <!-- Floating Cyber Eye in Center -->
      <a-entity 
        gltf-model="#cyber-eye"
        position="0 12 0"
        scale="3 3 3"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
        animation__float="property: position; to: 0 7 0; dir: alternate; loop: true; dur: 3000; easing: easeInOutSine">
        <a-light type="point" color="#ff0000" intensity="2" distance="30"></a-light>
      </a-entity>

      <!-- EXIT Button -->
      <a-entity id="exit-button" position="0 2 0" portal-button="target: intro">
        <a-box 
          width="2" 
          height="0.6" 
          depth="0.2" 
          class="clickable"
          material="color: #ff0000; shader: flat; side: double">
        </a-box>

        <a-box 
          width="2.1" 
          height="0.7" 
          depth="0.15" 
          position="0 0 -0.05"
          material="color: #ff0000; shader: flat; opacity: 0.4">
        </a-box>

        <a-text 
          value="EXIT" 
          align="center" 
          position="0 0 0.12" 
          color="#000000"
          width="5"
          material="side: double">
        </a-text>

        <a-text 
          value="EXIT" 
          align="center" 
          position="0 0 -0.13" 
          color="#000000"
          width="5"
          rotation="0 180 0"
          material="side: double">
        </a-text>
      </a-entity>

      <!-- Environment Title -->
      <a-text 
        value="TEXT REALM" 
        align="center" 
        position="0 12 0" 
        color="#ff0000" 
        width="20"
        opacity="0.8">
      </a-text>
      
      <!-- CORNER 1: TECHNOLOGICAL FEAR (Front-Left) -->
      <a-entity id="corner1" position="-12 0 -12" rotation="0 45 0">
        <a-plane 
          width="8" 
          height="5" 
          position="0 4 0"
          color="#000000"
          opacity="0.7">
          <a-plane 
            width="8.2" 
            height="5.2" 
            position="0 0 -0.01"
            material="color: #ff0000; shader: flat; opacity: 0.4">
          </a-plane>
        </a-plane>
        
        <a-text 
          value="What scares you the most about technology?" 
          align="center" 
          position="0 4 0.1" 
          color="#ff0000" 
          width="6"
          line-height="50"
          wrap-count="20">
        </a-text>
        
        <a-entity 
          position="0 1.2 0"
          question-responder="questionId: fear; questionText: What scares you the most about technology?">
          <a-box 
            color="#ff0000" 
            depth="0.2" 
            height="0.8" 
            width="3"
            class="clickable"
            material="shader: flat">
          </a-box>
          <a-text 
            value="RESPOND" 
            align="center" 
            position="0 0 0.11" 
            color="#000000" 
            width="6">
          </a-text>
        </a-entity>
        
        <a-entity id="responses-fear" position="0 2 5"></a-entity>
      </a-entity>
      
      <!-- CORNER 2: DATA IMAGINATION (Front-Right) -->
      <a-entity id="corner2" position="12 0 -12" rotation="0 -45 0">
        <a-plane 
          width="8" 
          height="5" 
          position="0 4 0"
          color="#000000"
          opacity="0.7">
          <a-plane 
            width="8.2" 
            height="5.2" 
            position="0 0 -0.01"
            material="color: #ff0000; shader: flat; opacity: 0.4">
          </a-plane>
        </a-plane>
        
        <a-text 
          value="What is data to you?" 
          align="center" 
          position="0 4 0.1" 
          color="#ff0000" 
          width="6"
          line-height="50"
          wrap-count="20">
        </a-text>
        
        <a-entity 
          position="0 1.2 0"
          question-responder="questionId: data; questionText: How do you define data?">
          <a-box 
            color="#ff0000" 
            depth="0.2" 
            height="0.8" 
            width="3"
            class="clickable"
            material="shader: flat">
          </a-box>
          <a-text 
            value="RESPOND" 
            align="center" 
            position="0 0 0.11" 
            color="#000000" 
            width="6">
          </a-text>
        </a-entity>
        
        <a-entity id="responses-data" position="0 2 5"></a-entity>
      </a-entity>
      
      <!-- CORNER 3: DISASSOCIATION (Back-Left) -->
      <a-entity id="corner3" position="-12 0 12" rotation="0 135 0">
        <a-plane 
          width="8" 
          height="5" 
          position="0 4 0"
          color="#000000"
          opacity="0.7">
          <a-plane 
            width="8.2" 
            height="5.2" 
            position="0 0 -0.01"
            material="color: #ff0000; shader: flat; opacity: 0.4">
          </a-plane>
        </a-plane>
        
        <a-text 
          value="What technology makes you disassociate from the present?" 
          align="center" 
          position="0 4 0.1" 
          color="#ff0000" 
          width="6"
          line-height="50"
          wrap-count="20">
        </a-text>

        <a-entity 
          position="0 1.2 0" 
          question-responder="questionId: disassociate; questionText: What technology makes you disassociate from the present the most?">
          <a-box 
            color="#ff0000" 
            depth="0.2" 
            height="0.8" 
            width="3"
            class="clickable"  
            material="shader: flat">
          </a-box>
          <a-text 
            value="RESPOND" 
            align="center" 
            position="0 0 0.11" 
            color="#000000" 
            width="6">
          </a-text>
        </a-entity>
        
        <a-entity id="responses-disassociate" position="0 2 5"></a-entity>
      </a-entity>
      
      <!-- CORNER 4: QUOTES (Back-Right) -->
      <a-entity id="corner4" position="12 0 12" rotation="0 -135 0">
        <a-entity text-quiz></a-entity>
      </a-entity>

    </a-entity>
    <!-- END TEXT SCENE -->


    <!-- ============================================ -->
    <!-- AUDIO SCENE -->
    <!-- ============================================ -->
    <a-entity id="audio-scene" visible="false">
      <a-sky color="#000000"></a-sky>
      <a-entity grid-floor="size: 50; divisions: 50; colorGrid: #00ff00"></a-entity>
      
      <!-- Lighting -->
      <a-light type="ambient" intensity="0.3" color="#002200"></a-light>
      <a-light type="point" position="0 10 0" intensity="1" color="#00ff00" distance="50"></a-light>
      
      <!-- Floating Cyber Eye in Center -->
      <a-entity 
        gltf-model="#cyber-eye"
        position="0 8 0"
        scale="3 3 3"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
        animation__float="property: position; to: 0 4 0; dir: alternate; loop: true; dur: 3000; easing: easeInOutSine">
        <a-light type="point" color="#00ff00" intensity="2" distance="30"></a-light>
      </a-entity>
      
      <!-- Environment Title -->
      <a-text 
        value="AUDIO REALM" 
        align="center" 
        position="0 12 0" 
        color="#00ff00" 
        width="20"
        opacity="0.8">
      </a-text>
      
      <!-- Voice-reactive spheres -->
      <a-entity audio-spheres="sensitivity: 35; maxSpheres: 15; recordDuration: 15"></a-entity>
      
      <!-- Music spheres -->
      <a-entity music-spheres="count: 8; radius: 15; playDuration: 5000; audioFiles: assets/audio/cyber-background.mp3, assets/audio/augmentation.mp3, assets/audio/BGA2.mp3"></a-entity>


      <!-- Back Button -->
      <a-entity portal-button="target: intro" position="0 1.5 8" >
        <a-box 
          color="#00ff00" 
          depth="0.2" 
          height="1" 
          width="3" 
          class="clickable"
          material="shader: flat; side: double">
        </a-box>

        <!-- Front text -->
        <a-text 
          value="EXIT" 
          align="center" 
          position="0 0 0.11" 
          color="#000000" 
          width="6"
          material="side: double">
        </a-text>
        
        <!-- Back text -->
        <a-text 
          value="EXIT" 
          align="center" 
          position="0 0 -0.11" 
          color="#000000" 
          width="6"
          rotation="0 180 0"
          material="side: double">
        </a-text>

      </a-entity>
      
    </a-entity>
    <!-- END AUDIO SCENE -->


    <!-- ============================================ -->
    <!-- IMAGE SCENE (Movement Realm) -->
    <!-- ============================================ -->
    <a-entity id="movement-scene" visible="false">

      <!-- Dark Blue Sky -->
      <a-sky color="#000015"></a-sky>
      
      <!-- Blue Grid Floor -->
      <a-entity 
        grid-floor="size: 100; divisions: 100; colorGrid: #0044ff; colorCenterLine: #00ffff" 
        position="0 0 0">
      </a-entity>
      
      <!-- Lighting -->
      <a-light type="ambient" intensity="0.4" color="#002244"></a-light>
      <a-light type="point" position="0 10 0" intensity="1.5" color="#00ffff" distance="50"></a-light>
      <a-light type="point" position="-10 5 -10" intensity="1" color="#0066ff" distance="30"></a-light>
      <a-light type="point" position="10 5 -10" intensity="0.8" color="#ff00ff" distance="30"></a-light>
      <a-light type="point" position="0 3 -10" intensity="1" color="#ffffff" distance="20"></a-light>
      
      <!-- Floating Cyber Eye in Center -->
      <a-entity 
        gltf-model="#cyber-eye"
        position="0 8 0"
        scale="3 3 3"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
        animation__float="property: position; to: 0 4 0; dir: alternate; loop: true; dur: 3000; easing: easeInOutSine">
        <a-light type="point" color="#0000ff" intensity="2" distance="30"></a-light>
      </a-entity>

      <!-- Environment Title -->
      <a-text 
        value="IMAGE REALM" 
        align="center" 
        position="0 12 0" 
        color="#00ffff" 
        width="20"
        opacity="0.8">
      </a-text>
      
      <!-- DECORATIVE DATA STREAMS -->
      <!-- <a-entity id="data-streams-blue">
        <a-cylinder position="-8 5 -12" radius="0.03" height="10" material="color: #00ffff; shader: flat" opacity="0.6"></a-cylinder>
        <a-cylinder position="-5 7 -18" radius="0.03" height="14" material="color: #0066ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="6 4 -15" radius="0.03" height="8" material="color: #00ffff; shader: flat" opacity="0.7"></a-cylinder>
        <a-cylinder position="10 6 -20" radius="0.03" height="12" material="color: #0088ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="-12 5 -8" radius="0.03" height="10" material="color: #00ffff; shader: flat" opacity="0.6"></a-cylinder>
        <a-cylinder position="8 8 -10" radius="0.03" height="16" material="color: #0044ff; shader: flat" opacity="0.5"></a-cylinder>
      </a-entity> -->

      <!-- EXPANDED DATA STREAMS - Add this to your existing scene -->
      <!-- This expands on your existing 6 blue cylinders to fill the entire realm -->
      <!-- Just paste this entire block into your VR scene HTML -->

      <a-entity id="data-streams-expanded">
        
        <!-- YOUR EXISTING 6 (keeping them) -->
        <a-cylinder position="-8 5 -12" radius="0.03" height="10" material="color: #00ffff; shader: flat" opacity="0.6"></a-cylinder>
        <a-cylinder position="-5 7 -18" radius="0.03" height="14" material="color: #0066ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="6 4 -15" radius="0.03" height="8" material="color: #00ffff; shader: flat" opacity="0.7"></a-cylinder>
        <a-cylinder position="10 6 -20" radius="0.03" height="12" material="color: #0088ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="-12 5 -8" radius="0.03" height="10" material="color: #00ffff; shader: flat" opacity="0.6"></a-cylinder>
        <a-cylinder position="8 8 -10" radius="0.03" height="16" material="color: #0044ff; shader: flat" opacity="0.5"></a-cylinder>
        
        <!-- ADDITIONAL STREAMS - FRONT ZONE -->
        <a-cylinder position="-3 6 -10" radius="0.03" height="12" material="color: #00ccff; shader: flat" opacity="0.6"></a-cylinder>
        <a-cylinder position="2 4 -14" radius="0.03" height="8" material="color: #0088ff; shader: flat" opacity="0.7"></a-cylinder>
        <a-cylinder position="-10 7 -16" radius="0.03" height="14" material="color: #0066ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="12 5 -14" radius="0.03" height="10" material="color: #00ffff; shader: flat" opacity="0.6"></a-cylinder>
        
        <!-- LEFT SIDE ZONE -->
        <a-cylinder position="-15 4 -5" radius="0.03" height="8" material="color: #00ffff; shader: flat" opacity="0.6"></a-cylinder>
        <a-cylinder position="-18 6 0" radius="0.03" height="12" material="color: #0088ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="-16 5 5" radius="0.03" height="10" material="color: #00ccff; shader: flat" opacity="0.7"></a-cylinder>
        <a-cylinder position="-20 7 -2" radius="0.03" height="14" material="color: #0066ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="-14 4 8" radius="0.03" height="8" material="color: #00ffff; shader: flat" opacity="0.6"></a-cylinder>
        
        <!-- RIGHT SIDE ZONE -->
        <a-cylinder position="15 4 -5" radius="0.03" height="8" material="color: #00ffff; shader: flat" opacity="0.6"></a-cylinder>
        <a-cylinder position="18 6 0" radius="0.03" height="12" material="color: #0088ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="16 5 5" radius="0.03" height="10" material="color: #00ccff; shader: flat" opacity="0.7"></a-cylinder>
        <a-cylinder position="20 7 -2" radius="0.03" height="14" material="color: #0066ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="14 4 8" radius="0.03" height="8" material="color: #00ffff; shader: flat" opacity="0.6"></a-cylinder>
        
        <!-- BACK ZONE -->
        <a-cylinder position="-10 5 12" radius="0.03" height="10" material="color: #00ffff; shader: flat" opacity="0.6"></a-cylinder>
        <a-cylinder position="-5 7 15" radius="0.03" height="14" material="color: #0066ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="0 6 18" radius="0.03" height="12" material="color: #00ffff; shader: flat" opacity="0.7"></a-cylinder>
        <a-cylinder position="5 4 15" radius="0.03" height="8" material="color: #0088ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="10 8 12" radius="0.03" height="16" material="color: #0044ff; shader: flat" opacity="0.5"></a-cylinder>
        
        <!-- CENTER ZONE (around player) -->
        <a-cylinder position="-4 5 -2" radius="0.03" height="10" material="color: #00ffff; shader: flat" opacity="0.6"></a-cylinder>
        <a-cylinder position="4 6 2" radius="0.03" height="12" material="color: #0088ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="-2 7 3" radius="0.03" height="14" material="color: #00ccff; shader: flat" opacity="0.7"></a-cylinder>
        <a-cylinder position="1 4 -4" radius="0.03" height="8" material="color: #0066ff; shader: flat" opacity="0.6"></a-cylinder>
        
        <!-- CEILING STREAMS (create overhead atmosphere) -->
        <a-cylinder position="-10 11 -8" radius="0.03" height="6" material="color: #00ffff; shader: flat" opacity="0.4"></a-cylinder>
        <a-cylinder position="10 11 -8" radius="0.03" height="6" material="color: #00ffff; shader: flat" opacity="0.4"></a-cylinder>
        <a-cylinder position="-10 11 8" radius="0.03" height="6" material="color: #00ffff; shader: flat" opacity="0.4"></a-cylinder>
        <a-cylinder position="10 11 8" radius="0.03" height="6" material="color: #00ffff; shader: flat" opacity="0.4"></a-cylinder>
        <a-cylinder position="0 12 0" radius="0.03" height="8" material="color: #0066ff; shader: flat" opacity="0.5"></a-cylinder>
        
        <!-- GROUND-LEVEL STREAMS (add depth near floor) -->
        <a-cylinder position="-7 2 -7" radius="0.03" height="4" material="color: #00ffff; shader: flat" opacity="0.7"></a-cylinder>
        <a-cylinder position="7 2 -7" radius="0.03" height="4" material="color: #00ffff; shader: flat" opacity="0.7"></a-cylinder>
        <a-cylinder position="-7 2 7" radius="0.03" height="4" material="color: #00ffff; shader: flat" opacity="0.7"></a-cylinder>
        <a-cylinder position="7 2 7" radius="0.03" height="4" material="color: #00ffff; shader: flat" opacity="0.7"></a-cylinder>
        <a-cylinder position="0 2 0" radius="0.03" height="4" material="color: #00ccff; shader: flat" opacity="0.8"></a-cylinder>
        
        <!-- DIAGONAL ACCENTS (add dynamic feel) -->
        <a-cylinder position="-12 6 -12" radius="0.03" height="12" material="color: #00ccff; shader: flat" opacity="0.6" rotation="0 0 10"></a-cylinder>
        <a-cylinder position="12 6 -12" radius="0.03" height="12" material="color: #00ccff; shader: flat" opacity="0.6" rotation="0 0 -10"></a-cylinder>
        <a-cylinder position="-12 6 12" radius="0.03" height="12" material="color: #00ccff; shader: flat" opacity="0.6" rotation="0 0 -10"></a-cylinder>
        <a-cylinder position="12 6 12" radius="0.03" height="12" material="color: #00ccff; shader: flat" opacity="0.6" rotation="0 0 10"></a-cylinder>
        
        <!-- TALL ACCENT STREAMS (varied heights) -->
        <a-cylinder position="-14 8 -3" radius="0.03" height="16" material="color: #0044ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="14 8 -3" radius="0.03" height="16" material="color: #0044ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="-14 9 3" radius="0.03" height="18" material="color: #0044ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="14 9 3" radius="0.03" height="18" material="color: #0044ff; shader: flat" opacity="0.5"></a-cylinder>
        
      </a-entity>

      <!-- OPTIONAL: Add subtle pulsing animation -->
      <!-- Uncomment this if you want the streams to pulse -->
      
      <script>
        AFRAME.registerComponent('pulse-streams', {
          init: function() {
            this.el.setAttribute('animation', {
              property: 'material.opacity',
              from: 0.3,
              to: 0.9,
              dur: 3000,
              dir: 'alternate',
              loop: true,
              easing: 'easeInOutSine'
            });
          }
        });
        
        // Apply to all cylinders in data-streams
        document.querySelectorAll('#data-streams-expanded a-cylinder').forEach(cylinder => {
          cylinder.setAttribute('pulse-streams', '');
        });
      </script>
     
      
      <!-- IMAGE GUESSING GAME AREA -->
      <a-entity id="image-game-area" position="0 0 -10" image-guesser>
        
        <!-- Main Image Display Frame -->
        <a-entity id="image-display" position="0 4 0">
          
          <!-- Outer glow frame -->
          <a-box 
            position="0 0 -0.1"
            width="5.5" 
            height="4.2" 
            depth="0.05"
            material="color: #0066ff; shader: flat; opacity: 0.6">
          </a-box>
          
          <!-- Inner dark frame -->
          <a-box 
            position="0 0 -0.05"
            width="5.2" 
            height="3.9" 
            depth="0.1"
            material="color: #000033">
          </a-box>
          
          <!-- Current image placeholder -->
          <a-plane 
            id="current-game-image"
            width="5" 
            height="3.7"
            position="0 0 0.01"
            material="shader: flat; side: double; transparent: false"
            visible="true">
          </a-plane>
          
          <!-- Loading text / Start prompt
          <a-text
            id="loading-text"
            value="Click START to begin!"
            align="center"
            position="0 0 0.02"
            color="#00ffff"
            width="6">
          </a-text> -->
          
          <!-- Question prompt -->
          <a-text
            id="game-question"
            value="Can you tell REAL from AI?"
            align="center"
            position="0 2.5 0"
            color="#00ffff"
            width="10">
          </a-text>
          
          <!-- Round counter -->
          <a-text
            id="round-counter"
            value="5 rounds"
            align="center"
            position="0 -2.5 0"
            color="#0088ff"
            width="5">
          </a-text>
          
        </a-entity>
        
        <!-- Answer Buttons Container -->
        <a-entity id="answer-buttons" position="0 1.2 3">
          
          <!-- REAL Button (Left) - Hidden until game starts -->
          <a-entity 
            id="btn-real"
            position="-2.5 0 0"
            visible="false">
            
            <!-- Outer glow box (NOT clickable) -->
            <a-box 
              width="2.2" 
              height="1" 
              depth="0.15"
              position="0 0 -0.05"
              material="color: #00ff00; shader: flat; opacity: 0.3">
            </a-box>
            
            <!-- Inner box WITH component and clickable -->
            <a-box 
              width="2" 
              height="0.8" 
              depth="0.2"
              material="color: #004400"
              class="clickable"
              game-answer-button="answer: real">
            </a-box>
            
            <a-text 
              value="REAL" 
              align="center" 
              position="0 0 0.11"
              color="#00ff00"
              width="5">
            </a-text>
          </a-entity>
          
          <!-- AI Button (Right) - Hidden until game starts -->
          <a-entity 
            id="btn-ai"
            position="2.5 0 0"
            visible="false">
            
            <!-- Outer glow box (NOT clickable) -->
            <a-box 
              width="2.2" 
              height="1" 
              depth="0.15"
              position="0 0 -0.05"
              material="color: #ff00ff; shader: flat; opacity: 0.3">
            </a-box>
            
            <!-- Inner box WITH component and clickable -->
            <a-box 
              width="2" 
              height="0.8" 
              depth="0.2"
              material="color: #440044"
              class="clickable"
              game-answer-button="answer: ai">
            </a-box>
            
            <a-text 
              value="AI" 
              align="center" 
              position="0 0 0.11"
              color="#ff00ff"
              width="5">
            </a-text>
          </a-entity>
          
          <!-- START Button (shown initially) -->
          <a-entity 
            id="btn-start"
            position="0 0 0"
            visible="true">
            
            <!-- Outer glow box (NOT clickable) -->
            <a-box 
              width="3"
              height="1.2"
              depth="0.15"
              position="0 0 -0.05"
              material="color: #00ffff; shader: flat; opacity: 0.4">
            </a-box>
            
            <!-- Inner box WITH component and clickable -->
            <a-box 
              id="start-clickable"
              width="2.8"
              height="1"
              depth="0.2"
              material="color: #006666"
              class="clickable">
            </a-box>
            
            <a-text 
              value="START"
              align="center"
              position="0 0 0.11"
              color="#00ffff"
              width="8">
            </a-text>
          </a-entity>
          
        </a-entity>
        
        <!-- Feedback Display -->
        <a-entity id="game-feedback" position="0 7.2 0" visible="false">
          <a-text
            id="feedback-text"
            value=""
            align="center"
            color="#ffffff"
            width="12">
          </a-text>
        </a-entity>
        
        <!-- Score Display (hidden initially) -->
        <a-entity id="score-display" position="0 7.8 0">
          <a-text
            id="score-text"
            value=""
            align="center"
            color="#00ffff"
            width="8">
          </a-text>
        </a-entity>
        
      </a-entity>
      <!-- END image-game-area -->
      
      <!-- EXIT BUTTON -->
      <a-entity id="movement-exit" position="0 1.5 8">
        <a-box 
          width="3.2" 
          height="1.1" 
          depth="0.15"
          position="0 0 -0.05"
          material="color: #0066ff; shader: flat; opacity: 0.4">
        </a-box>
        
        <a-box 
          width="3" 
          height="0.9" 
          depth="0.2" 
          class="clickable"
          portal-button="target: intro"
          material="color: #003366; shader: flat; side: double">
        </a-box>
        
        <!-- Front text -->
        <a-text 
          value="EXIT" 
          align="center" 
          position="0 0 0.12" 
          color="#00ffff"
          width="6"
          material="side: double">
        </a-text>

        <!-- Back text -->
        <a-text 
          value="EXIT" 
          align="center" 
          position="0 0 -0.13" 
          color="#00ffff" 
          width="6"
          rotation="0 180 0"
          material="side: double">
        </a-text>


      </a-entity>
      
    </a-entity>
    <!-- END MOVEMENT SCENE -->

  </a-scene>
