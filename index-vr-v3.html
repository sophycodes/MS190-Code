<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Figaroa - Scene 2: 3 Paths</title>
  <meta name="description" content="VR Cyberspace Experience">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
  <link rel="stylesheet" href="style-vr.css">
</head>
<body>
  <!-- ADD SCENE MANAGER HERE -->
  <a-scene background="color: #000000" scene-manager="currentScene: intro">
    
    <!-- ============================================ -->
    <!-- CAMERA & PLAYER (shared across all scenes) -->
    <!-- ============================================ -->
    <a-entity id="player" position="0.0 0.0 4.8">
      <a-camera>
        <a-cursor color="#00FFFF" raycaster="objects: .clickable"></a-cursor>
      </a-camera>
      
      <a-entity id="leftHand" 
                hand-controls="hand: left; handModelStyle: lowPoly; color: #00FFFF"
                position="-0.3 0 -0.5">
      </a-entity>
      
      <a-entity id="rightHand" 
                hand-controls="hand: right; handModelStyle: lowPoly; color: #00FFFF"
                position="0.3 0 -0.5">
      </a-entity>
    </a-entity>

    <!-- ============================================ -->
    <!-- INTRO SCENE - Your existing portal selection -->
    <!-- ============================================ -->
    <a-entity id="intro-scene">
      
      <!-- LIGHTING -->
      <a-entity light="type: ambient; color: #222; intensity: 0.4"></a-entity>
      <a-entity light="type: point; color: #FF0000; intensity: 2; distance: 20" position="-4 2 -10"></a-entity>
      <a-entity light="type: point; color: #00FF00; intensity: 2; distance: 20" position="0 2 -10"></a-entity>
      <a-entity light="type: point; color: #0000FF; intensity: 2; distance: 20" position="4 2 -10"></a-entity>

      <!-- BEGIN BUTTON -->
      <a-entity id="beginButton" position="0 0.5 -3" class="clickable">
        <a-box width="1.5" height="0.5" depth="0.1" color="#1a1a1a"
               material="shader: flat; transparent: true; opacity: 0.8">
          <a-box width="1.52" height="0.52" depth="0.08" color="#00FFFF" opacity="0.3" position="0 0 -0.01"></a-box>
        </a-box>
        <a-text value="BEGIN" position="0 0 0.06" align="center" color="#FFFFFF" width="3" shader="flat"></a-text>
      </a-entity>

      <!-- LEFT PATHWAY - TEXT (NEON RED) -->
      <!-- ADD portal-button component to make it clickable -->
      <a-entity id="pathwayText" 
                class="pathway clickable" 
                position="-3.5 0 0"
                portal-button="target: text">
        
        <!-- All your existing TEXT pathway code -->
        <a-entity id="circlesLeft" position="0 1.6 -8">
          <a-ring position="0 0 0" radius-inner="1.5" radius-outer="1.6" color="#FF0000" opacity="0.3" material="shader: flat"></a-ring>
          <a-ring position="0 0 -3" radius-inner="1.5" radius-outer="1.6" color="#FF0000" opacity="0.2" material="shader: flat"></a-ring>
          <a-ring position="0 0 -6" radius-inner="1.5" radius-outer="1.6" color="#FF0000" opacity="0.15" material="shader: flat"></a-ring>
          <a-ring position="0 0 -9" radius-inner="1.5" radius-outer="1.6" color="#FF0000" opacity="0.1" material="shader: flat"></a-ring>
        </a-entity>
        
        <a-box position="-0.6 0.01 -10" width="0.03" height="0.03" depth="20" color="#880000" material="shader: flat; emissive: #880000; emissiveIntensity: 1.5"></a-box>
        <a-box position="-0.3 0.01 -10" width="0.03" height="0.03" depth="20" color="#CC0000" material="shader: flat; emissive: #CC0000; emissiveIntensity: 1.5"></a-box>
        <a-box position="0 0.01 -10" width="0.03" height="0.03" depth="20" color="#FF0000" material="shader: flat; emissive: #FF0000; emissiveIntensity: 2"></a-box>
        <a-box position="0.3 0.01 -10" width="0.03" height="0.03" depth="20" color="#CC0000" material="shader: flat; emissive: #CC0000; emissiveIntensity: 1.5"></a-box>
        <a-box position="0.6 0.01 -10" width="0.03" height="0.03" depth="20" color="#880000" material="shader: flat; emissive: #880000; emissiveIntensity: 1.5"></a-box>
        
        <a-entity id="gridMarkersR">
          <a-sphere position="0 0.05 -5" radius="0.05" color="#FF0000" opacity="0.6"></a-sphere>
          <a-sphere position="0 0.05 -10" radius="0.05" color="#FF0000" opacity="0.6"></a-sphere>
          <a-sphere position="0 0.05 -15" radius="0.05" color="#FF0000" opacity="0.6"></a-sphere>
        </a-entity>
        
        <!-- ADD "ENTER" prompt below TEXT label -->
        <a-text value="TEXT" position="0 1.5 -2" align="center" color="#FF0000" width="4" shader="flat"
                animation="property: position; to: 0 1.8 -2; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine"></a-text>
        
        <a-text value="[ ENTER ]" position="0 0.8 -2" align="center" color="#FF0000" width="3" shader="flat"
                animation="property: opacity; from: 0.5; to: 1; dir: alternate; loop: true; dur: 1000"></a-text>
      </a-entity>

      <!-- CENTER PATHWAY - AUDIO (NEON GREEN) -->
      <a-entity id="pathwayAudio" 
                class="pathway clickable" 
                position="0 0 0"
                portal-button="target: audio">
        
        <!-- All your existing AUDIO pathway code -->
        <a-entity id="circlesCenter" position="0 1.6 -8">
          <a-ring position="0 0 0" radius-inner="1.5" radius-outer="1.6" color="#00FF00" opacity="0.3" material="shader: flat"></a-ring>
          <a-ring position="0 0 -3" radius-inner="1.5" radius-outer="1.6" color="#00FF00" opacity="0.2" material="shader: flat"></a-ring>
          <a-ring position="0 0 -6" radius-inner="1.5" radius-outer="1.6" color="#00FF00" opacity="0.15" material="shader: flat"></a-ring>
          <a-ring position="0 0 -9" radius-inner="1.5" radius-outer="1.6" color="#00FF00" opacity="0.1" material="shader: flat"></a-ring>
        </a-entity>
        
        <a-box position="-0.6 0.01 -10" width="0.03" height="0.03" depth="20" color="#008800" material="shader: flat; emissive: #008800; emissiveIntensity: 1.5"></a-box>
        <a-box position="-0.3 0.01 -10" width="0.03" height="0.03" depth="20" color="#00CC00" material="shader: flat; emissive: #00CC00; emissiveIntensity: 1.5"></a-box>
        <a-box position="0 0.01 -10" width="0.03" height="0.03" depth="20" color="#00FF00" material="shader: flat; emissive: #00FF00; emissiveIntensity: 2"></a-box>
        <a-box position="0.3 0.01 -10" width="0.03" height="0.03" depth="20" color="#00CC00" material="shader: flat; emissive: #00CC00; emissiveIntensity: 1.5"></a-box>
        <a-box position="0.6 0.01 -10" width="0.03" height="0.03" depth="20" color="#008800" material="shader: flat; emissive: #008800; emissiveIntensity: 1.5"></a-box>
        
        <a-entity id="gridMarkersG">
          <a-sphere position="0 0.05 -5" radius="0.05" color="#00FF00" opacity="0.6"></a-sphere>
          <a-sphere position="0 0.05 -10" radius="0.05" color="#00FF00" opacity="0.6"></a-sphere>
          <a-sphere position="0 0.05 -15" radius="0.05" color="#00FF00" opacity="0.6"></a-sphere>
        </a-entity>
        
        <a-text value="AUDIO" position="0 1.5 -2" align="center" color="#00FF00" width="4" shader="flat"
                animation="property: position; to: 0 1.8 -2; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine; delay: 500"></a-text>
        
        <a-text value="[ ENTER ]" position="0 0.8 -2" align="center" color="#00FF00" width="3" shader="flat"
                animation="property: opacity; from: 0.5; to: 1; dir: alternate; loop: true; dur: 1000"></a-text>
      </a-entity>

      <!-- RIGHT PATHWAY - MOVEMENT (NEON BLUE) -->
      <a-entity id="pathwayMovement" 
                class="pathway clickable" 
                position="3.5 0 0"
                portal-button="target: movement">
        
        <!-- All your existing MOVEMENT pathway code -->
        <a-entity id="circlesRight" position="0 1.6 -8">
          <a-ring position="0 0 0" radius-inner="1.5" radius-outer="1.6" color="#0000FF" opacity="0.3" material="shader: flat"></a-ring>
          <a-ring position="0 0 -3" radius-inner="1.5" radius-outer="1.6" color="#0000FF" opacity="0.2" material="shader: flat"></a-ring>
          <a-ring position="0 0 -6" radius-inner="1.5" radius-outer="1.6" color="#0000FF" opacity="0.15" material="shader: flat"></a-ring>
          <a-ring position="0 0 -9" radius-inner="1.5" radius-outer="1.6" color="#0000FF" opacity="0.1" material="shader: flat"></a-ring>
        </a-entity>
        
        <a-box position="-0.6 0.01 -10" width="0.03" height="0.03" depth="20" color="#000088" material="shader: flat; emissive: #000088; emissiveIntensity: 1.5"></a-box>
        <a-box position="-0.3 0.01 -10" width="0.03" height="0.03" depth="20" color="#0000CC" material="shader: flat; emissive: #0000CC; emissiveIntensity: 1.5"></a-box>
        <a-box position="0 0.01 -10" width="0.03" height="0.03" depth="20" color="#0000FF" material="shader: flat; emissive: #0000FF; emissiveIntensity: 2"></a-box>
        <a-box position="0.3 0.01 -10" width="0.03" height="0.03" depth="20" color="#0000CC" material="shader: flat; emissive: #0000CC; emissiveIntensity: 1.5"></a-box>
        <a-box position="0.6 0.01 -10" width="0.03" height="0.03" depth="20" color="#000088" material="shader: flat; emissive: #000088; emissiveIntensity: 1.5"></a-box>
        
        <a-entity id="gridMarkersB">
          <a-sphere position="0 0.05 -5" radius="0.05" color="#0000FF" opacity="0.6"></a-sphere>
          <a-sphere position="0 0.05 -10" radius="0.05" color="#0000FF" opacity="0.6"></a-sphere>
          <a-sphere position="0 0.05 -15" radius="0.05" color="#0000FF" opacity="0.6"></a-sphere>
        </a-entity>
        
        <a-text value="MOVEMENT" position="0 1.5 -2" align="center" color="#0000FF" width="4" shader="flat"
                animation="property: position; to: 0 1.8 -2; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine; delay: 1000"></a-text>
        
        <a-text value="[ ENTER ]" position="0 0.8 -2" align="center" color="#0000FF" width="3" shader="flat"
                animation="property: opacity; from: 0.5; to: 1; dir: alternate; loop: true; dur: 1000"></a-text>
      </a-entity>

      <!-- ENVIRONMENT -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#000000" material="shader: flat"></a-plane>
      <a-sky color="#000000"></a-sky>
      
    </a-entity>

    <!-- ============================================ -->
    <!-- TEXT SCENE - New environment for TEXT pathway -->
    <!-- ============================================ -->
    <a-entity id="text-scene" visible="false">
      
      <!-- Red Grid Floor (like your reference image) -->
      <a-entity grid-floor="size: 50; divisions: 50; colorGrid: #ff0000; colorCenterLine: #ff3333"></a-entity>
      
      <!-- Sky -->
      <a-sky color="#000000"></a-sky>
      
      <!-- Lighting -->
      <a-light type="ambient" intensity="0.4"></a-light>
      <a-light type="point" position="0 10 0" intensity="0.8" color="#ff0000"></a-light>
      
      <!-- Environment Title -->
      <a-text value="TEXT REALM" align="center" position="0 3 -8" color="#ff0000" width="12"></a-text>
      
      <!-- Example: Floating text fragments for collection -->
      <a-entity position="-3 2 -5">
        <a-text value="WHO?" color="#ff0000" width="4"></a-text>
      </a-entity>
      
      <!-- Back button -->
      <a-entity portal-button="target: intro" position="0 1.5 5" class="clickable">
        <a-box color="#ff0000" depth="0.2" height="1" width="3" opacity="0.8"></a-box>
        <a-text value="<< BACK" align="center" position="0 0 0.11" color="#000000" width="6"></a-text>
      </a-entity>
      
    </a-entity>

    <!-- ============================================ -->
    <!-- AUDIO SCENE (placeholder) -->
    <!-- ============================================ -->
    <a-entity id="audio-scene" visible="false">
      <a-entity grid-floor="size: 50; divisions: 50; colorGrid: #00ff00"></a-entity>
      <a-sky color="#000000"></a-sky>
      <a-text value="AUDIO REALM" align="center" position="0 3 -8" color="#00ff00" width="12"></a-text>
      
      <a-entity portal-button="target: intro" position="0 1.5 5" class="clickable">
        <a-box color="#00ff00" depth="0.2" height="1" width="3" opacity="0.8"></a-box>
        <a-text value="<< BACK" align="center" position="0 0 0.11" color="#000000" width="6"></a-text>
      </a-entity>
    </a-entity>

    <!-- ============================================ -->
    <!-- MOVEMENT SCENE (placeholder) -->
    <!-- ============================================ -->
    <a-entity id="movement-scene" visible="false">
      <a-entity grid-floor="size: 50; divisions: 50; colorGrid: #0000ff"></a-entity>
      <a-sky color="#000000"></a-sky>
      <a-text value="MOVEMENT REALM" align="center" position="0 3 -8" color="#0000ff" width="12"></a-text>
      
      <a-entity portal-button="target: intro" position="0 1.5 5" class="clickable">
        <a-box color="#0000ff" depth="0.2" height="1" width="3" opacity="0.8"></a-box>
        <a-text value="<< BACK" align="center" position="0 0 0.11" color="#000000" width="6"></a-text>
      </a-entity>
    </a-entity>

  </a-scene>

  <!-- JAVASCRIPT FILES -->
  <script src="scene-manager.js"></script>
  <script src="player.js"></script>
  <script src="pathways.js"></script>
  <script src="data-fragments.js"></script>
  <script src="vr-scene.js"></script>
</body>
</html>
