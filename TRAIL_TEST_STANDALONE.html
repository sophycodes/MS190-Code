<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trail Test - Guaranteed to Work</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  
  <script>
    // INLINE SIMPLE TRAIL - No external files needed
    AFRAME.registerComponent('simple-trail', {
      init: function() {
        console.log('Simple trail started!');
        this.camera = document.querySelector('[camera]');
        this.lastPos = new THREE.Vector3();
        this.blocks = [];
        
        // Create test block immediately
        setTimeout(() => {
          console.log('Creating test block in 3 seconds...');
          const testBlock = document.createElement('a-box');
          testBlock.setAttribute('position', '0 1 -3');
          testBlock.setAttribute('width', '0.5');
          testBlock.setAttribute('height', '0.5');
          testBlock.setAttribute('depth', '0.5');
          testBlock.setAttribute('color', '#00ffff');
          testBlock.setAttribute('material', 'shader: flat; emissive: #00ffff; emissiveIntensity: 2');
          this.el.sceneEl.appendChild(testBlock);
          console.log('Test block created! Look straight ahead.');
        }, 3000);
      },
      
      tick: function() {
        if (!this.camera) return;
        
        const currentPos = this.camera.object3D.position;
        const dist = this.lastPos.distanceTo(currentPos);
        
        // Drop block every 0.5 meters moved
        if (dist > 0.5) {
          console.log('DROP! Creating trail block at:', currentPos);
          
          const block = document.createElement('a-box');
          block.setAttribute('position', `${currentPos.x} 0.5 ${currentPos.z}`);
          block.setAttribute('width', '0.3');
          block.setAttribute('height', '0.3');
          block.setAttribute('depth', '0.3');
          block.setAttribute('color', '#00ffff');
          block.setAttribute('material', 'shader: flat; emissive: #00ffff; emissiveIntensity: 2.5; opacity: 0.9');
          
          this.el.sceneEl.appendChild(block);
          this.blocks.push(block);
          this.lastPos.copy(currentPos);
          
          // Remove after 5 seconds
          setTimeout(() => {
            if (block.parentNode) {
              block.parentNode.removeChild(block);
            }
          }, 5000);
        }
      }
    });
    
    console.log('Simple trail component loaded!');
  </script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #instructions {
      position: fixed;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      font-family: monospace;
      z-index: 1000;
      border: 2px solid #00ffff;
    }
  </style>
</head>
<body>
  <div id="instructions">
    <h3>🎮 TRAIL TEST</h3>
    <p><strong>Instructions:</strong></p>
    <ol>
      <li>Wait 3 seconds - a cyan box will appear</li>
      <li>Press F12 to open console</li>
      <li>In VR: Walk around your play space</li>
      <li>Blocks should drop every 0.5 meters</li>
    </ol>
    <p><strong>Console:</strong> Check for "DROP!" messages</p>
  </div>

  <a-scene>
    <!-- Camera -->
    <a-entity id="player" position="0 1.6 0">
      <a-camera look-controls wasd-controls></a-camera>
    </a-entity>
    
    <!-- TRAIL COMPONENT -->
    <a-entity simple-trail></a-entity>
    
    <!-- TRON-style Grid Floor (like yours) -->
    <a-entity id="grid-floor">
      <!-- Horizontal lines -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" 
               material="color: #000022; wireframe: true; wireframeLinewidth: 2"></a-plane>
      
      <!-- Grid lines (simplified) -->
      <a-entity position="0 0.01 0">
        <!-- Front-back lines -->
        <a-box position="-10 0 0" width="0.02" height="0.01" depth="50" color="#0088ff" opacity="0.5"></a-box>
        <a-box position="-5 0 0" width="0.02" height="0.01" depth="50" color="#0088ff" opacity="0.5"></a-box>
        <a-box position="0 0 0" width="0.02" height="0.01" depth="50" color="#00ffff" opacity="0.7"></a-box>
        <a-box position="5 0 0" width="0.02" height="0.01" depth="50" color="#0088ff" opacity="0.5"></a-box>
        <a-box position="10 0 0" width="0.02" height="0.01" depth="50" color="#0088ff" opacity="0.5"></a-box>
        
        <!-- Left-right lines -->
        <a-box position="0 0 -10" width="50" height="0.01" depth="0.02" color="#0088ff" opacity="0.5"></a-box>
        <a-box position="0 0 -5" width="50" height="0.01" depth="0.02" color="#0088ff" opacity="0.5"></a-box>
        <a-box position="0 0 0" width="50" height="0.01" depth="0.02" color="#00ffff" opacity="0.7"></a-box>
        <a-box position="0 0 5" width="50" height="0.01" depth="0.02" color="#0088ff" opacity="0.5"></a-box>
        <a-box position="0 0 10" width="50" height="0.01" depth="0.02" color="#0088ff" opacity="0.5"></a-box>
      </a-entity>
    </a-entity>
    
    <!-- Reference sphere -->
    <a-sphere position="0 1 -5" radius="0.3" color="#ff0055" 
              material="shader: flat; emissive: #ff0055; emissiveIntensity: 2"></a-sphere>
    
    <!-- Some data stream cylinders -->
    <a-cylinder position="-3 3 -8" radius="0.03" height="6" color="#00ffff" opacity="0.6"></a-cylinder>
    <a-cylinder position="3 3 -8" radius="0.03" height="6" color="#00ffff" opacity="0.6"></a-cylinder>
    
    <!-- Dark sky -->
    <a-sky color="#000011"></a-sky>
    
    <!-- VR Controls (if you have them) -->
    <a-entity laser-controls="hand: left"></a-entity>
    <a-entity laser-controls="hand: right"></a-entity>
  </a-scene>
</body>
</html>
