<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Data Echoes & Traces</title>
  <meta name="description" content="VR Cyberspace Experience">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <link rel="stylesheet" href="style-vr.css">
</head>
<body>

  <a-scene 
  background="color: #000000" 
  scene-manager="currentScene: intro"
  loading-screen="dotsColor: #00ff00; backgroundColor: #000000">

    <!-- ============================================ -->
    <!-- ASSETS -->
    <!-- ============================================ -->
    <a-assets>
      <audio id="bg-music" src="assets/audio/cyber-background.mp3" preload="auto"></audio>
      <a-asset-item id="cyber-eye" src="assets/cyber_eye.glb"></a-asset-item>

      <!-- AI Images -->
      <img id="ai-car" src="assets/imgs/AI/car-AI.jpg">
      <img id="ai-face" src="assets/imgs/AI/face-AI.png">
      <img id="ai-flowers" src="assets/imgs/AI/flowers-AI.jpg">
      <img id="ai-house" src="assets/imgs/AI/house3-AI.png">
      <img id="ai-lion" src="assets/imgs/AI/lion-AI.png">
      <img id="ai-celeb" src="assets/imgs/AI/NPCeleb-AI.jpg">
      <img id="ai-poodle" src="assets/imgs/AI/poodle-AI.jpeg">
      
      <!-- Real Images -->
      <img id="real-car" src="assets/imgs/Real/car-Real.jpg">
      <img id="real-face" src="assets/imgs/Real/face-Real.jpg">
      <img id="real-flowers" src="assets/imgs/Real/flowers-Real.png">
      <img id="real-house" src="assets/imgs/Real/house-Real.jpg">
      <img id="real-lion" src="assets/imgs/Real/lion-Real.jpeg">
      <img id="real-celeb" src="assets/imgs/Real/NPCeleb-Real.jpg">
      <img id="real-poodle" src="assets/imgs/Real/poodle-Real.png">
    </a-assets>

    <!-- Background Music -->
    <a-entity id="background-music" 
        sound="src: #bg-music; loop: true; volume: 0.3; autoplay: true"
        position="0 0 0">
    </a-entity>

    <!-- ============================================ -->
    <!-- CAMERA & PLAYER (shared across all scenes) -->
    <!-- ============================================ -->
    <a-entity id="player" position="0 0 1.5">
      <a-camera>
        <a-cursor 
          geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.012"
          material="color: #00FFFF; shader: flat"
          scale="0.3 0.3 0.3"
          raycaster="objects: .clickable; far: 20; direction: 0 0 -1; interval: 50"
          position="0 0 -0.1"
          fuse="false">
        </a-cursor>
      </a-camera>
      
      <a-entity 
        id="leftHand" 
        hand-controls="hand: left; handModelStyle: lowPoly; color: #00FFFF"
        position="-0.3 0 -0.5"
        ribbon-trail="color: #00ffff; maxPoints: 60; fadeTime: 2000; width: 0.04"
        ghost-silhouette="color: #00ffff; interval: 400">
      </a-entity>

      <a-entity 
        id="rightHand" 
        hand-controls="hand: right; handModelStyle: lowPoly; color: #00FFFF"
        position="0.3 0 -0.5"
        ribbon-trail="color: #ff00ff; maxPoints: 60; fadeTime: 2000; width: 0.04"
        ghost-silhouette="color: #ff00ff; interval: 400">
      </a-entity>
    </a-entity>

    <!-- ============================================ -->
    <!-- INTRO SCENE - Portal Selection (SCALED) -->
    <!-- ============================================ -->
    <a-entity id="intro-scene">
      
      <!-- LIGHTING -->
      <a-entity light="type: ambient; color: #222; intensity: 0.4"></a-entity>
      <a-entity light="type: point; color: #FF0000; intensity: 2; distance: 10" position="-1 2 -2"></a-entity>
      <a-entity light="type: point; color: #00FF00; intensity: 2; distance: 10" position="0 2 -2"></a-entity>
      <a-entity light="type: point; color: #0000FF; intensity: 2; distance: 10" position="1 2 -2"></a-entity>

      <!-- LEFT PATHWAY - TEXT (NEON RED) -->
      <a-entity id="pathwayText" class="pathway" position="-1 0 0">
        
        <a-entity id="circlesLeft" position="0 1.4 -1.5">
          <a-ring position="0 0 0" radius-inner="0.4" radius-outer="0.45" color="#FF0000" opacity="0.3" material="shader: flat"></a-ring>
          <a-ring position="0 0 -0.5" radius-inner="0.4" radius-outer="0.45" color="#FF0000" opacity="0.2" material="shader: flat"></a-ring>
          <a-ring position="0 0 -1" radius-inner="0.4" radius-outer="0.45" color="#FF0000" opacity="0.15" material="shader: flat"></a-ring>
        </a-entity>
        
        <a-box position="-0.15 0.01 -1.5" width="0.01" height="0.01" depth="3" material="color: #880000; shader: flat"></a-box>
        <a-box position="0 0.01 -1.5" width="0.01" height="0.01" depth="3" material="color: #FF0000; shader: flat"></a-box>
        <a-box position="0.15 0.01 -1.5" width="0.01" height="0.01" depth="3" material="color: #880000; shader: flat"></a-box>
        
        <a-text 
          value="TEXT" 
          position="0 1.3 -0.3" 
          align="center" 
          color="#FF0000" 
          width="2" 
          shader="flat"
          animation="property: position; to: 0 1.4 -0.3; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
        </a-text>
        
        <a-entity position="0 0.8 -0.5" portal-button="target: text">
          <a-box 
            width="0.8" 
            height="0.3" 
            depth="0.05" 
            class="clickable"
            material="color: #000000; opacity: 0.5; transparent: true; side: double">
          </a-box>
          <a-text 
            value="[ ENTER ]" 
            align="center" 
            position="0 0 0.03"
            color="#FF0000" 
            width="1.5" 
            shader="flat"
            animation="property: opacity; from: 0.5; to: 1; dir: alternate; loop: true; dur: 1000">
          </a-text>
        </a-entity>

      </a-entity>

      <!-- CENTER PATHWAY - AUDIO (NEON GREEN) -->
      <a-entity id="pathwayAudio" class="pathway" position="0 0 0">
        
        <a-entity id="circlesCenter" position="0 1.4 -1.5">
          <a-ring position="0 0 0" radius-inner="0.4" radius-outer="0.45" color="#00FF00" opacity="0.3" material="shader: flat"></a-ring>
          <a-ring position="0 0 -0.5" radius-inner="0.4" radius-outer="0.45" color="#00FF00" opacity="0.2" material="shader: flat"></a-ring>
          <a-ring position="0 0 -1" radius-inner="0.4" radius-outer="0.45" color="#00FF00" opacity="0.15" material="shader: flat"></a-ring>
        </a-entity>
        
        <a-box position="-0.15 0.01 -1.5" width="0.01" height="0.01" depth="3" material="color: #008800; shader: flat"></a-box>
        <a-box position="0 0.01 -1.5" width="0.01" height="0.01" depth="3" material="color: #00FF00; shader: flat"></a-box>
        <a-box position="0.15 0.01 -1.5" width="0.01" height="0.01" depth="3" material="color: #008800; shader: flat"></a-box>
        
        <a-text 
          value="AUDIO" 
          position="0 1.3 -0.3" 
          align="center" 
          color="#00FF00" 
          width="2" 
          shader="flat"
          animation="property: position; to: 0 1.4 -0.3; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine; delay: 500">
        </a-text>
        
        <a-entity position="0 0.8 -0.5" portal-button="target: audio">
          <a-box 
            width="0.8" 
            height="0.3" 
            depth="0.05" 
            class="clickable"
            material="color: #000000; opacity: 0.5; transparent: true; side: double">
          </a-box>
          <a-text 
            value="[ ENTER ]" 
            align="center" 
            position="0 0 0.03"
            color="#00FF00" 
            width="1.5" 
            shader="flat"
            animation="property: opacity; from: 0.5; to: 1; dir: alternate; loop: true; dur: 1000">
          </a-text>
        </a-entity>

      </a-entity>

      <!-- RIGHT PATHWAY - MOVEMENT (NEON BLUE) -->
      <a-entity id="pathwayMovement" class="pathway" position="1 0 0">
        
        <a-entity id="circlesRight" position="0 1.4 -1.5">
          <a-ring position="0 0 0" radius-inner="0.4" radius-outer="0.45" color="#0000FF" opacity="0.3" material="shader: flat"></a-ring>
          <a-ring position="0 0 -0.5" radius-inner="0.4" radius-outer="0.45" color="#0000FF" opacity="0.2" material="shader: flat"></a-ring>
          <a-ring position="0 0 -1" radius-inner="0.4" radius-outer="0.45" color="#0000FF" opacity="0.15" material="shader: flat"></a-ring>
        </a-entity>
        
        <a-box position="-0.15 0.01 -1.5" width="0.01" height="0.01" depth="3" material="color: #000088; shader: flat"></a-box>
        <a-box position="0 0.01 -1.5" width="0.01" height="0.01" depth="3" material="color: #0000FF; shader: flat"></a-box>
        <a-box position="0.15 0.01 -1.5" width="0.01" height="0.01" depth="3" material="color: #000088; shader: flat"></a-box>
        
        <a-text 
          value="IMAGE" 
          position="0 1.3 -0.3" 
          align="center" 
          color="#0000FF" 
          width="2" 
          shader="flat"
          animation="property: position; to: 0 1.4 -0.3; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine; delay: 1000">
        </a-text>
        
        <a-entity position="0 0.8 -0.5" portal-button="target: movement">
          <a-box 
            width="0.8" 
            height="0.3" 
            depth="0.05" 
            class="clickable"
            material="color: #000000; opacity: 0.5; transparent: true; side: double">
          </a-box>
          <a-text 
            value="[ ENTER ]" 
            align="center" 
            position="0 0 0.03"
            color="#0000FF" 
            width="1.5" 
            shader="flat"
            animation="property: opacity; from: 0.5; to: 1; dir: alternate; loop: true; dur: 1000">
          </a-text>
        </a-entity>

      </a-entity>

      <!-- ENVIRONMENT -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#000000" material="shader: flat"></a-plane>
      <a-sky color="#000000"></a-sky>
      
    </a-entity>
    <!-- END INTRO SCENE -->


    <!-- ============================================ -->
    <!-- TEXT SCENE (SCALED for 3.3m x 1.5m) -->
    <!-- ============================================ -->
    <a-entity id="text-scene" visible="false">
    
      <!-- Dark Sky -->
      <a-sky color="#000000"></a-sky>
      
      <!-- Red Grid Floor -->
      <a-entity 
        grid-floor="size: 6; divisions: 12; colorGrid: #ff0000; colorCenterLine: #ff3333" 
        position="0 0 0">
      </a-entity>

      <!-- Lighting -->
      <a-light type="ambient" intensity="0.3" color="#220000"></a-light>
      <a-light type="point" position="0 3 0" intensity="0.5" color="#ff0000" distance="20"></a-light>

      <!-- ============================================ -->
      <!-- TEXT REALM INTRO CARD - User appears in front of this -->
      <!-- Position: directly in front of player at z=-1.5 -->
      <!-- ============================================ -->
      <a-entity id="text-realm-card" position="0 1.6 -1.5">
        
        <!-- Background plane -->
        <a-plane 
          width="2.8" 
          height="2" 
          position="0 0 0"
          color="#000000"
          opacity="0.9">
        </a-plane>
        
        <!-- Red border glow -->
        <a-plane 
          width="2.9" 
          height="2.1" 
          position="0 0 -0.01"
          material="color: #ff0000; shader: flat; opacity: 0.4">
        </a-plane>
        
        <!-- Title -->
        <a-text 
          value="TEXT REALM" 
          align="center" 
          position="0 0.7 0.02" 
          color="#ff0000" 
          width="3"
          shader="flat">
        </a-text>
        
        <!-- Description text -->
        <a-text 
          value="Every day, billions of emails, searches,\nand posts flood the digital world.\nHow much of it is true?\n\nExplore four corners:\nThree pose questions about technology.\nOne tests if you can spot misinformation.\n\nExplore. Question. Create."
          align="center" 
          position="0 -0.1 0.02" 
          color="#cccccc" 
          width="2.5"
          line-height="55"
          wrap-count="45"
          shader="flat">
        </a-text>

        <!-- CONTINUE Button on the card -->
        <a-entity position="0 -0.8 0.05">
          <a-box 
            width="0.8" 
            height="0.25" 
            depth="0.05" 
            class="clickable"
            material="color: #ff0000; shader: flat"
            realm-continue-button="targetCard: text-realm-card">
          </a-box>
          <a-text 
            value="CONTINUE" 
            align="center" 
            position="0 0 0.03" 
            color="#000000"
            width="2">
          </a-text>
        </a-entity>
        
      </a-entity>
      
      <!-- Floating Cyber Eye in Center -->
      <a-entity 
        gltf-model="#cyber-eye"
        position="0 3.5 0"
        scale="1.5 1.5 1.5"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
        animation__float="property: position; to: 0 3.2 0; dir: alternate; loop: true; dur: 3000; easing: easeInOutSine">
        <a-light type="point" color="#ff0000" intensity="1" distance="15"></a-light>
      </a-entity>

      <!-- EXIT Button - Center below eye -->
      <a-entity id="exit-button" position="0 2 0" portal-button="target: intro">
        <a-box 
          width="1" 
          height="0.35" 
          depth="0.1" 
          class="clickable"
          material="color: #ff0000; shader: flat">
        </a-box>
        <a-box 
          width="1.1" 
          height="0.4" 
          depth="0.08" 
          position="0 0 -0.03"
          material="color: #ff0000; shader: flat; opacity: 0.4">
        </a-box>
        <a-text 
          value="EXIT" 
          align="center" 
          position="0 0 0.06" 
          color="#000000"
          width="3">
        </a-text>
      </a-entity>

      <!-- Environment Title - Above eye -->
      <a-text 
        value="TEXT REALM" 
        align="center" 
        position="0 4.5 0" 
        color="#ff0000" 
        width="10"
        opacity="0.8">
      </a-text>
      
      <!-- CORNER 1: TECHNOLOGICAL FEAR (Front-Left) -->
      <a-entity id="corner1" position="-1.2 0 -1.4" rotation="0 45 0">
        <a-plane 
          width="2" 
          height="1.5" 
          position="0 1.5 0"
          color="#000000"
          opacity="0.7">
          <a-plane 
            width="2.1" 
            height="1.6" 
            position="0 0 -0.01"
            material="color: #ff0000; shader: flat; opacity: 0.4">
          </a-plane>
        </a-plane>
        
        <a-text 
          value="What scares you\nthe most about\ntechnology?" 
          align="center" 
          position="0 1.5 0.05" 
          color="#ff0000" 
          width="1.8"
          line-height="50"
          wrap-count="18">
        </a-text>
        
        <a-entity 
          position="0 0.5 0"
          question-responder="questionId: fear; questionText: What scares you the most about technology?">
          <a-box 
            color="#ff0000" 
            depth="0.1" 
            height="0.3" 
            width="1"
            class="clickable"
            material="shader: flat">
          </a-box>
          <a-text 
            value="RESPOND" 
            align="center" 
            position="0 0 0.06" 
            color="#000000" 
            width="2.5">
          </a-text>
        </a-entity>
        
        <a-entity id="responses-fear" position="0 1 1"></a-entity>
      </a-entity>
      
      <!-- CORNER 2: DATA IMAGINATION (Front-Right) -->
      <a-entity id="corner2" position="1.2 0 -1.4" rotation="0 -45 0">
        <a-plane 
          width="2" 
          height="1.5" 
          position="0 1.5 0"
          color="#000000"
          opacity="0.7">
          <a-plane 
            width="2.1" 
            height="1.6" 
            position="0 0 -0.01"
            material="color: #ff0000; shader: flat; opacity: 0.4">
          </a-plane>
        </a-plane>
        
        <a-text 
          value="What is data\nto you?" 
          align="center" 
          position="0 1.5 0.05" 
          color="#ff0000" 
          width="1.8"
          line-height="50"
          wrap-count="18">
        </a-text>
        
        <a-entity 
          position="0 0.5 0"
          question-responder="questionId: data; questionText: How do you define data?">
          <a-box 
            color="#ff0000" 
            depth="0.1" 
            height="0.3" 
            width="1"
            class="clickable"
            material="shader: flat">
          </a-box>
          <a-text 
            value="RESPOND" 
            align="center" 
            position="0 0 0.06" 
            color="#000000" 
            width="2.5">
          </a-text>
        </a-entity>
        
        <a-entity id="responses-data" position="0 1 1"></a-entity>
      </a-entity>
      
      <!-- CORNER 3: DISASSOCIATION (Back-Left) -->
      <a-entity id="corner3" position="-1.2 0 1.4" rotation="0 135 0">
        <a-plane 
          width="2" 
          height="1.5" 
          position="0 1.5 0"
          color="#000000"
          opacity="0.7">
          <a-plane 
            width="2.1" 
            height="1.6" 
            position="0 0 -0.01"
            material="color: #ff0000; shader: flat; opacity: 0.4">
          </a-plane>
        </a-plane>
        
        <a-text 
          value="What technology\nmakes you\ndisassociate from\nthe present?" 
          align="center" 
          position="0 1.5 0.05" 
          color="#ff0000" 
          width="1.8"
          line-height="50"
          wrap-count="18">
        </a-text>

        <a-entity 
          position="0 0.5 0" 
          question-responder="questionId: disassociate; questionText: What technology makes you disassociate from the present the most?">
          <a-box 
            color="#ff0000" 
            depth="0.1" 
            height="0.3" 
            width="1"
            class="clickable"  
            material="shader: flat">
          </a-box>
          <a-text 
            value="RESPOND" 
            align="center" 
            position="0 0 0.06" 
            color="#000000" 
            width="2.5">
          </a-text>
        </a-entity>
        
        <a-entity id="responses-disassociate" position="0 1 1"></a-entity>
      </a-entity>
      
      <!-- CORNER 4: QUIZ (Back-Right) -->
      <a-entity id="corner4" position="1.2 0 1.4" rotation="0 -135 0">
        <a-entity text-quiz></a-entity>
      </a-entity>

    </a-entity>
    <!-- END TEXT SCENE -->


    <!-- ============================================ -->
    <!-- AUDIO SCENE (SCALED for 3.3m x 1.5m) -->
    <!-- ============================================ -->
    <a-entity id="audio-scene" visible="false">
      <a-sky color="#000000"></a-sky>
      <a-entity grid-floor="size: 6; divisions: 12; colorGrid: #00ff00"></a-entity>
      
      <!-- Lighting -->
      <a-light type="ambient" intensity="0.3" color="#002200"></a-light>
      <a-light type="point" position="0 3 0" intensity="1" color="#00ff00" distance="20"></a-light>

      <!-- ============================================ -->
      <!-- AUDIO REALM INTRO CARD -->
      <!-- ============================================ -->
      <a-entity id="audio-realm-card" position="0 1.6 -1.5">
        
        <!-- Background plane -->
        <a-plane 
          width="2.8" 
          height="2" 
          position="0 0 0"
          color="#000000"
          opacity="0.9">
        </a-plane>
        
        <!-- Green border glow -->
        <a-plane 
          width="2.9" 
          height="2.1" 
          position="0 0 -0.01"
          material="color: #00ff00; shader: flat; opacity: 0.4">
        </a-plane>
        
        <!-- Title -->
        <a-text 
          value="AUDIO REALM" 
          align="center" 
          position="0 0.7 0.02" 
          color="#00ff00" 
          width="3"
          shader="flat">
        </a-text>
        
        <!-- Description text -->
        <a-text 
          value="Sound is data too. Your voice becomes\nvisible echoes in this digital space.\n\nRecord your thoughts and watch them\nmanifest as glowing spheres.\n\nExplore sounds left by others.\nClick the floating orbs to listen.\n\nSpeak. Listen. Leave your trace."
          align="center" 
          position="0 -0.1 0.02" 
          color="#cccccc" 
          width="2.5"
          line-height="55"
          wrap-count="45"
          shader="flat">
        </a-text>

        <!-- CONTINUE Button -->
        <a-entity position="0 -0.8 0.05">
          <a-box 
            width="0.8" 
            height="0.25" 
            depth="0.05" 
            class="clickable"
            material="color: #00ff00; shader: flat"
            realm-continue-button="targetCard: audio-realm-card">
          </a-box>
          <a-text 
            value="CONTINUE" 
            align="center" 
            position="0 0 0.03" 
            color="#000000"
            width="2">
          </a-text>
        </a-entity>
        
      </a-entity>
      
      <!-- Floating Cyber Eye in Center -->
      <a-entity 
        gltf-model="#cyber-eye"
        position="0 3.5 0"
        scale="1.5 1.5 1.5"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
        animation__float="property: position; to: 0 3 0; dir: alternate; loop: true; dur: 3000; easing: easeInOutSine">
        <a-light type="point" color="#00ff00" intensity="1" distance="15"></a-light>
      </a-entity>
      
      <!-- Environment Title -->
      <a-text 
        value="AUDIO REALM" 
        align="center" 
        position="0 4.5 0" 
        color="#00ff00" 
        width="10"
        opacity="0.8">
      </a-text>
      
      <!-- Voice-reactive spheres - smaller spawn radius -->
      <a-entity audio-spheres="sensitivity: 35; maxSpheres: 10; recordDuration: 15; spawnRadius: 2"></a-entity>
      
      <!-- Music spheres - smaller radius -->
      <a-entity music-spheres="count: 6; radius: 2; playDuration: 5000; audioFiles: assets/audio/cyber-background.mp3, assets/audio/augmentation.mp3, assets/audio/BGA2.mp3"></a-entity>

      <!-- Back Button -->
      <a-entity portal-button="target: intro" position="0 1.2 1.5">
        <a-box 
          color="#00ff00" 
          depth="0.1" 
          height="0.4" 
          width="1.2" 
          class="clickable"
          material="shader: flat">
        </a-box>
        <a-text 
          value="EXIT" 
          align="center" 
          position="0 0 0.06" 
          color="#000000" 
          width="3">
        </a-text>
      </a-entity>
      
    </a-entity>
    <!-- END AUDIO SCENE -->


    <!-- ============================================ -->
    <!-- IMAGE SCENE (SCALED for 3.3m x 1.5m) -->
    <!-- ============================================ -->
    <a-entity id="movement-scene" visible="false">

      <!-- Dark Blue Sky -->
      <a-sky color="#000015"></a-sky>
      
      <!-- Blue Grid Floor -->
      <a-entity 
        grid-floor="size: 6; divisions: 12; colorGrid: #0044ff; colorCenterLine: #00ffff" 
        position="0 0 0">
      </a-entity>
      
      <!-- Lighting -->
      <a-light type="ambient" intensity="0.4" color="#002244"></a-light>
      <a-light type="point" position="0 3 0" intensity="1.5" color="#00ffff" distance="20"></a-light>
      <a-light type="point" position="-1 2 -1" intensity="1" color="#0066ff" distance="10"></a-light>
      <a-light type="point" position="1 2 -1" intensity="0.8" color="#ff00ff" distance="10"></a-light>

      <!-- ============================================ -->
      <!-- IMAGE REALM INTRO CARD -->
      <!-- ============================================ -->
      <a-entity id="image-realm-card" position="0 1.6 -1.5">
        
        <!-- Background plane -->
        <a-plane 
          width="2.8" 
          height="2" 
          position="0 0 0"
          color="#000000"
          opacity="0.9">
        </a-plane>
        
        <!-- Blue border glow -->
        <a-plane 
          width="2.9" 
          height="2.1" 
          position="0 0 -0.01"
          material="color: #00ffff; shader: flat; opacity: 0.4">
        </a-plane>
        
        <!-- Title -->
        <a-text 
          value="IMAGE REALM" 
          align="center" 
          position="0 0.7 0.02" 
          color="#00ffff" 
          width="3"
          shader="flat">
        </a-text>
        
        <!-- Description text -->
        <a-text 
          value="AI-generated images flood our feeds.\nCan you tell what's real anymore?\n\nYou'll see 5 images.\nDecide: REAL photo or AI generated?\n\nTrust your instincts.\nQuestion what you see.\n\nHow sharp is your digital eye?"
          align="center" 
          position="0 -0.1 0.02" 
          color="#cccccc" 
          width="2.5"
          line-height="55"
          wrap-count="45"
          shader="flat">
        </a-text>

        <!-- CONTINUE Button -->
        <a-entity position="0 -0.8 0.05">
          <a-box 
            width="0.8" 
            height="0.25" 
            depth="0.05" 
            class="clickable"
            material="color: #00ffff; shader: flat"
            realm-continue-button="targetCard: image-realm-card">
          </a-box>
          <a-text 
            value="CONTINUE" 
            align="center" 
            position="0 0 0.03" 
            color="#000000"
            width="2">
          </a-text>
        </a-entity>
        
      </a-entity>
      
      <!-- Floating Cyber Eye in Center -->
      <a-entity 
        gltf-model="#cyber-eye"
        position="0 3.5 0"
        scale="1.5 1.5 1.5"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
        animation__float="property: position; to: 0 3 0; dir: alternate; loop: true; dur: 3000; easing: easeInOutSine">
        <a-light type="point" color="#0000ff" intensity="1" distance="15"></a-light>
      </a-entity>

      <!-- Environment Title -->
      <a-text 
        value="IMAGE REALM" 
        align="center" 
        position="0 4.5 0" 
        color="#00ffff" 
        width="10"
        opacity="0.8">
      </a-text>
      
      <!-- DECORATIVE DATA STREAMS - Scaled down -->
      <a-entity id="data-streams-blue">
        <a-cylinder position="-1.2 2 -1.5" radius="0.02" height="4" material="color: #00ffff; shader: flat" opacity="0.6"></a-cylinder>
        <a-cylinder position="-0.8 2.5 -2" radius="0.02" height="5" material="color: #0066ff; shader: flat" opacity="0.5"></a-cylinder>
        <a-cylinder position="0.8 1.8 -1.8" radius="0.02" height="3.5" material="color: #00ffff; shader: flat" opacity="0.7"></a-cylinder>
        <a-cylinder position="1.2 2.2 -2.2" radius="0.02" height="4.5" material="color: #0088ff; shader: flat" opacity="0.5"></a-cylinder>
      </a-entity>
      
      <!-- IMAGE GUESSING GAME AREA - Moved closer -->
      <a-entity id="image-game-area" position="0 0 -1.8" image-guesser>
        
        <!-- Main Image Display Frame -->
        <a-entity id="image-display" position="0 1.8 0">
          
          <!-- Outer glow frame -->
          <a-box 
            position="0 0 -0.05"
            width="2.2" 
            height="1.7" 
            depth="0.03"
            material="color: #0066ff; shader: flat; opacity: 0.6">
          </a-box>
          
          <!-- Inner dark frame -->
          <a-box 
            position="0 0 -0.03"
            width="2.1" 
            height="1.6" 
            depth="0.05"
            material="color: #000033">
          </a-box>
          
          <!-- Current image placeholder -->
          <a-plane 
            id="current-game-image"
            width="2" 
            height="1.5"
            position="0 0 0.01"
            material="shader: flat; side: double; transparent: false"
            visible="true">
          </a-plane>
          
          <!-- Question prompt -->
          <a-text
            id="game-question"
            value="Can you tell REAL from AI?"
            align="center"
            position="0 1 0"
            color="#00ffff"
            width="4">
          </a-text>
          
          <!-- Round counter -->
          <a-text
            id="round-counter"
            value="5 rounds"
            align="center"
            position="0 -1 0"
            color="#0088ff"
            width="2.5">
          </a-text>
          
        </a-entity>
        
        <!-- Answer Buttons Container -->
        <a-entity id="answer-buttons" position="0 0.6 0.8">
          
          <!-- REAL Button (Left) -->
          <a-entity 
            id="btn-real"
            position="-0.8 0 0"
            visible="false">
            
            <a-box 
              width="0.9" 
              height="0.45" 
              depth="0.08"
              position="0 0 -0.03"
              material="color: #00ff00; shader: flat; opacity: 0.3">
            </a-box>
            
            <a-box 
              width="0.8" 
              height="0.35" 
              depth="0.1"
              material="color: #004400"
              class="clickable"
              game-answer-button="answer: real">
            </a-box>
            
            <a-text 
              value="REAL" 
              align="center" 
              position="0 0 0.06"
              color="#00ff00"
              width="2.5">
            </a-text>
          </a-entity>
          
          <!-- AI Button (Right) -->
          <a-entity 
            id="btn-ai"
            position="0.8 0 0"
            visible="false">
            
            <a-box 
              width="0.9" 
              height="0.45" 
              depth="0.08"
              position="0 0 -0.03"
              material="color: #ff00ff; shader: flat; opacity: 0.3">
            </a-box>
            
            <a-box 
              width="0.8" 
              height="0.35" 
              depth="0.1"
              material="color: #440044"
              class="clickable"
              game-answer-button="answer: ai">
            </a-box>
            
            <a-text 
              value="AI" 
              align="center" 
              position="0 0 0.06"
              color="#ff00ff"
              width="2.5">
            </a-text>
          </a-entity>
          
          <!-- START Button -->
          <a-entity 
            id="btn-start"
            position="0 0 0"
            visible="true">
            
            <a-box 
              width="1.2"
              height="0.5"
              depth="0.08"
              position="0 0 -0.03"
              material="color: #00ffff; shader: flat; opacity: 0.4">
            </a-box>
            
            <a-box 
              id="start-clickable"
              width="1.1"
              height="0.4"
              depth="0.1"
              material="color: #006666"
              class="clickable">
            </a-box>
            
            <a-text 
              value="START"
              align="center"
              position="0 0 0.06"
              color="#00ffff"
              width="4">
            </a-text>
          </a-entity>
          
        </a-entity>
        
        <!-- Feedback Display -->
        <a-entity id="game-feedback" position="0 2.8 0" visible="false">
          <a-text
            id="feedback-text"
            value=""
            align="center"
            color="#ffffff"
            width="6">
          </a-text>
        </a-entity>
        
        <!-- Score Display -->
        <a-entity id="score-display" position="0 3.2 0">
          <a-text
            id="score-text"
            value=""
            align="center"
            color="#00ffff"
            width="4">
          </a-text>
        </a-entity>
        
      </a-entity>
      <!-- END image-game-area -->
      
      <!-- EXIT BUTTON -->
      <a-entity id="movement-exit" position="0 1.2 1.5">
        <a-box 
          width="1.3" 
          height="0.45" 
          depth="0.08"
          position="0 0 -0.03"
          material="color: #0066ff; shader: flat; opacity: 0.4">
        </a-box>
        
        <a-box 
          width="1.2" 
          height="0.4" 
          depth="0.1" 
          class="clickable"
          portal-button="target: intro"
          material="color: #003366; shader: flat">
        </a-box>
        
        <a-text 
          value="EXIT" 
          align="center" 
          position="0 0 0.06" 
          color="#00ffff"
          width="3">
        </a-text>
      </a-entity>
      
    </a-entity>
    <!-- END MOVEMENT/IMAGE SCENE -->

  </a-scene>

  <!-- JAVASCRIPT FILES -->
  <script src="supabase-config.js"></script>

  <script src="player.js"></script>
  <script src="pathways.js"></script>
  <script src="audio-spheres.js"></script>
  <script src="music-spheres.js"></script>
